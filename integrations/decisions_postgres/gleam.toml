name = "decisions_postgres"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.18.0"
licenses = ["Apache-2.0"]
description = "The PostgreSQL store for decisions: the storage port, its migrations, Grind workers for wake-ups and settlements, NOTIFY and the queue queries."
repository = { type = "github", user = "gleam-dream", repo = "decisions" }
internal_modules = ["decisions_postgres/internal", "decisions_postgres/internal/*"]

[dependencies]
decisions = { path = "../.." }
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
grind = ">= 0.1.1 and < 0.2.0"
sinal = ">= 0.1.0 and < 0.2.0"
# Pinned tight, not the usual `>= x.y.0 and < (x+1).0.0`: an application
# shares one pog/pgo pool between itself, Grind and this package, and Grind
# pins these exact minor ranges because its FFI matches pog's and pgo's
# private connection shapes. This package relies on the same shapes: it
# tells a pool from a transaction's connection (`{pool, _}` against
# `{single_connection, _}`), and its listener runs `pgo_notifications`.
# Keep both ranges equal to Grind's.
pog = ">= 4.1.0 and < 4.2.0"
pgo = ">= 0.20.0 and < 0.21.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
# The shared race and crash scenarios (`decisions_otp/stress`), run against
# this adapter in the test suite only.
decisions_otp = { path = "../decisions_otp" }
