# The BEAM around `decisions`: a process-safe in-memory store, a supervised
# runtime, model calls in processes of their own, parallel replay and live
# notifications. A separate package, so that the core never depends on
# gleam_otp.
name = "decisions_otp"
version = "0.2.0"
target = "erlang"
gleam = ">= 1.18.0"
licenses = ["Apache-2.0"]
description = "The BEAM around decisions: a process-safe store, a supervised runtime, isolated model calls, parallel replay, live notifications and a reusable stress suite."
repository = { type = "github", user = "gleam-dream", repo = "decisions" }
internal_modules = ["decisions_otp/internal", "decisions_otp/internal/*"]

[dependencies]
decisions = ">= 0.2.0 and < 0.3.0"
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
sinal = ">= 0.2.0 and < 0.3.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
